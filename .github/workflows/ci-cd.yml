name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        run: cd backend && npm install --no-audit --no-fund

      - name: Run Backend Tests
        run: cd backend && npm test

      - name: Install Frontend Dependencies
        run: cd frontend && npm install --no-audit --no-fund

      - name: Build Frontend
        run: cd frontend && npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Images
        run: docker compose build

      - name: Push to Registry (Optional)
        # Add your registry credentials and push commands here
        run: echo "Docker images built successfully"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Server (Optional)
        # Add your deployment commands here
        # Example: SSH to server and pull latest changes
        run: echo "Deployment script would run here"
