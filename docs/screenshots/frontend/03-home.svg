<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Home Screenshot Placeholder</title>
  <desc id="desc">A styled placeholder image for the home page screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1080" cy="160" r="190" fill="#f59e0b" opacity="0.16"/>
  <rect x="80" y="90" width="1120" height="540" rx="28" fill="#0b1220" opacity="0.82" stroke="#334155"/>
  <text x="160" y="190" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">Home Page</text>
  <text x="160" y="245" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="26">Featured products and hero area</text>
  <rect x="160" y="300" width="250" height="220" rx="20" fill="#172554"/>
