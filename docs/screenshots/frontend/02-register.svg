<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Register Screenshot Placeholder</title>
  <desc id="desc">A styled placeholder image for the registration page screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="250" y="100" width="780" height="520" rx="32" fill="#111827" stroke="#475569" stroke-width="2"/>
  <text x="640" y="200" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">Register Page</text>
  <text x="640" y="255" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">Screenshot placeholder</text>
  <rect x="340" y="310" width="600" height="54" rx="12" fill="#0f172a" stroke="#64748b"/>
  <rect x="340" y="380" width="600" height="54" rx="12" fill="#0f172a" stroke="#64748b"/>
  <rect x="340" y="450" width="600" height="54" rx="12" fill="#0f172a" stroke="#64748b"/>
  <rect x="340" y="520" width="220" height="54" rx="12" fill="#38bdf8"/>
  <text x="450" y="556" text-anchor="middle" fill="#082f49" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Create Account</text>
</svg>