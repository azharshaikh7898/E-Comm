<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Login Screenshot Placeholder</title>
  <desc id="desc">A styled placeholder image for the login page screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1040" cy="130" r="180" fill="#22c55e" opacity="0.18"/>
  <circle cx="180" cy="610" r="220" fill="#38bdf8" opacity="0.14"/>
  <rect x="320" y="120" width="640" height="480" rx="28" fill="url(#card)" stroke="#334155" stroke-width="2"/>
  <text x="640" y="230" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">Login Page</text>
  <text x="640" y="290" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="24">Screenshot placeholder</text>
  <rect x="400" y="340" width="480" height="56" rx="12" fill="#0f172a" stroke="#475569"/>
  <rect x="400" y="414" width="480" height="56" rx="12" fill="#0f172a" stroke="#475569"/>
  <rect x="400" y="490" width="200" height="56" rx="12" fill="#22c55e"/>
  <text x="500" y="527" text-anchor="middle" fill="#06250f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Sign In</text>
</svg>