<div class="auth-container">
  <div class="auth-card">
    <h1>Create Account</h1>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="submit()">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input 
            id="firstName"
            type="text" 
            formControlName="firstName"
            placeholder="First name"
            [class.is-invalid]="submitted && f['firstName'].errors" />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input 
            id="lastName"
            type="text" 
            formControlName="lastName"
            placeholder="Last name"
            [class.is-invalid]="submitted && f['lastName'].errors" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email"
          type="email" 
          formControlName="email"
          placeholder="Enter your email"
          [class.is-invalid]="submitted && f['email'].errors" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password"
          type="password" 
          formControlName="password"
          placeholder="Enter your password"
          [class.is-invalid]="submitted && f['password'].errors" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          id="confirmPassword"
          type="password" 
          formControlName="confirmPassword"
          placeholder="Confirm password"
          [class.is-invalid]="submitted && (f['confirmPassword'].errors || registerForm.errors)" />
        <div *ngIf="submitted && registerForm.errors?.['passwordMismatch']" class="error-text">
          Passwords do not match
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
    </form>

    <div class="auth-link">
      Already have an account? <a routerLink="/auth/login">Login here</a>
    </div>
  </div>
</div>
